<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Carrito de Compras</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!--<link rel="stylesheet" type="text/css" href="PDIstyle.css">-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style2.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body {
      background-color: #000305;
      color: white;
    }
    h1.section-title {
      text-align: center;
      color: #ADD8E6;
      margin: 30px 0 20px;
    }
    .carousel img {
      object-fit: cover;
      height: 500px;
    }
    .navbar .bi {
      font-size: 1.4rem;
    }
  </style>
</head>
<body class="bg-dark text-white">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
  <div class="container-fluid">

    <!-- Logo -->
    <img src="R.png" alt="Logo" style="height: 60px; margin-right: 10px;" />

    <!-- Toggler para responsive -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Contenido colapsable -->
    <div class="collapse navbar-collapse justify-content-between" id="navbarScroll">

      <!-- Izquierda: Botón Back -->
      <div class="d-flex align-items-center">
        <a href="alumno.html" class="btn btn-outline-light me-3">Back</a>
      </div>

      <!-- Derecha: Info usuario y botones -->
      <div class="d-flex align-items-center ms-auto">
        <span id="infoUsuario" class="text-white me-3"></span>

        <button id="btnTarjeta" class="btn btn-light me-2" data-bs-toggle="modal" data-bs-target="#tarjetaModal">
          Agregar tarjeta
        </button>

        <button id="cerrarSesion" class="btn btn-outline-light">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>

    </div>
  </div>
</nav>

<!-- Padding para que el contenido no quede tapado -->
<div style="padding-top: 80px;"></div>


  <!-- MODAL Tarjeta -->
  <div class="modal fade" id="tarjetaModal" tabindex="-1" aria-labelledby="tarjetaModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-white">
        <div class="modal-header">
          <h5 class="modal-title" id="tarjetaModalLabel">Agregar tarjeta de crédito</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form id="tarjetaForm">
            <div class="mb-3">
              <input type="text" class="form-control" id="bancoTarjeta" placeholder="Nombre del banco" required />
            </div>
            <div class="mb-3">
              <input type="text" class="form-control" id="numeroTarjeta" placeholder="Número de tarjeta" required />
            </div>
            <button type="submit" class="btn btn-success w-100">Guardar tarjeta</button>
            <div id="tarjetaMensaje" class="mt-2"></div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <!--Modal de QR-->
  <div class="modal fade" id="qrModal" tabindex="-1" aria-labelledby="qrModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-white">
        <div class="modal-header">
          <h5 class="modal-title" id="qrModalLabel">Escanear QR o descargar</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body text-center">
          <img src="./frame.png" id="qrImage" class="img-fluid mb-3" alt="Codigo QR">
        </div>
        <div class="modal-footer">
          <a href="./frame.png" download="codigo-qr-pago.png" class="btn btn-primary">
            <i class="bi bi-download"></i> Descargar
          </a>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- CONTENIDO -->
  <div class="container my-4" id="general_container">
    <div class="row">
      <h2 class="mx-auto mb-4">Tu carrito:</h2>

      <!-- Lista productos -->
      <div class="col-lg-8" id="cart_container"></div>

      <!-- Resumen -->
      <div class="col-lg-4 mt-4 mt-lg-0">
        <div class="card p-4 shadow-sm w-100 text-dark" id="purchase_summary">
          <h4>Total:</h4>
          <div id="purchase_items" class="mt-2"></div>
          <hr>
          <h5>Total: <span id="total_amount">$0.00 MXN</span></h5>
          <p id="descuentoDocente" class="text-success mt-2"></p>
          <p id="tarjetaResumen" class="text-muted mt-2"></p>
          <button id="btnPagar" class="btn btn-success w-100 mt-2">Pagar</button>
          <!--<button class="btn btn-success w-100 mt-2" data-bs-toggle="modal" data-bs-target="#qrModal">Pagar</button>-->
          <button class="btn btn-danger w-100 mt-2" id="vaciarCarrito">Vaciar carrito</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const infoUsuario = document.getElementById("infoUsuario");
      const nombre = localStorage.getItem("usuarioNombre");
      const rol = localStorage.getItem("usuarioRol");
      if (nombre && rol) {
        infoUsuario.textContent = `Hola, ${nombre} (${rol})`;
      } else {
        infoUsuario.textContent = "No has iniciado sesión";
      }

      document.getElementById("cerrarSesion")?.addEventListener("click", () => {
        localStorage.clear();
        window.location.href = "alumno.html";
      });

      // Mostrar productos en el carrito
      const cartContainer = document.getElementById("cart_container");
      const purchaseItems = document.getElementById("purchase_items");
      const totalAmount = document.getElementById("total_amount");

      let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

      if (carrito.length === 0) {
        cartContainer.innerHTML = '<p class="text-muted">Tu carrito está vacío.</p>';
        totalAmount.textContent = "$0.00 MXN";
        return;
      }

      let total = 0;
      carrito.forEach((item, index) => {
        total += parseFloat(item.precio);

        const itemCard = document.createElement("div");
        itemCard.className = "card text-dark mb-2";
        itemCard.innerHTML = `
          <div class="card-body d-flex justify-content-between align-items-center">
            <div>
              <h5 class="card-title mb-1">${item.nombre}</h5>
              <p class="card-text">$${item.precio}</p>
            </div>
            <button class="btn btn-sm btn-outline-danger eliminar-producto" data-index="${index}">Eliminar</button>
          </div>
        `;
        cartContainer.appendChild(itemCard);

        const resumen = document.createElement("p");
        resumen.textContent = `${item.nombre} - $${item.precio}`;
        purchaseItems.appendChild(resumen);
      });

      totalAmount.textContent = `$${total.toFixed(2)} MXN`;

      // Eliminar producto
      document.querySelectorAll(".eliminar-producto").forEach(btn => {
        btn.addEventListener("click", (e) => {
          const index = e.target.dataset.index;
          carrito.splice(index, 1);
          localStorage.setItem("carrito", JSON.stringify(carrito));
          location.reload();
        });
      });

      // Vaciar carrito
      document.getElementById("vaciarCarrito").addEventListener("click", () => {
        localStorage.removeItem("carrito");
        location.reload();
      });
    });
  </script>
  
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const infoUsuario = document.getElementById("infoUsuario");
    const nombre = localStorage.getItem("usuarioNombre");
    const rol = localStorage.getItem("usuarioRol");
    if (nombre && rol) {
      infoUsuario.textContent = `Hola, ${nombre} (${rol})`;
    } else {
      infoUsuario.textContent = "No has iniciado sesión";
    }
  
    document.getElementById("cerrarSesion")?.addEventListener("click", () => {
      localStorage.clear();
      window.location.href = "alumno.html";
    });
  
    const cartContainer = document.getElementById("cart_container");
    const purchaseItems = document.getElementById("purchase_items");
    const totalAmount = document.getElementById("total_amount");
  
    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
  
    function renderCart() {
      cartContainer.innerHTML = "";
      purchaseItems.innerHTML = "";
      let total = 0;
  
      if (carrito.length === 0) {
        cartContainer.innerHTML = '<p class="text-muted">Tu carrito está vacío.</p>';
        totalAmount.textContent = "$0.00 MXN";
        document.getElementById("btnPagar").style.display = "none";
        document.getElementById("vaciarCarrito").style.display = "none";

        return;
      }
  
      carrito.forEach((item, index) => {
        total += item.precio * item.cantidad;
  
        const itemCard = document.createElement("div");
        itemCard.className = "card text-dark mb-2";
        itemCard.innerHTML = `
          <div class="card-body d-flex justify-content-between align-items-center">
            <div>
              <h5 class="card-title mb-1">${item.nombre}</h5>
              <p class="card-text">
                $<span id="subtotal-${index}">${(item.precio * item.cantidad).toFixed(2)}</span>
                (<input type="number" min="1" value="${item.cantidad}" class="form-control d-inline-block" style="width: 70px" data-index="${index}" /> x $${item.precio})
              </p>
            </div>
            <button class="btn btn-sm btn-outline-danger eliminar-producto" data-index="${index}">Eliminar</button>
          </div>
        `;
        cartContainer.appendChild(itemCard);
  
        const resumen = document.createElement("p");
        resumen.textContent = `${item.nombre} x ${item.cantidad} - $${(item.precio * item.cantidad).toFixed(2)}`;
        purchaseItems.appendChild(resumen);
      });
      if (rol === "docente") {
        total = total * 0.9;
        document.getElementById("descuentoDocente").textContent = "Descuento aplicado para docentes (10%)";
        } else {
        document.getElementById("descuentoDocente").textContent = "";
      }

      totalAmount.textContent = `$${total.toFixed(2)} MXN`;
      document.getElementById("btnPagar").style.display = "block";
      document.getElementById("vaciarCarrito").style.display = "block";

  
      document.querySelectorAll(".eliminar-producto").forEach(btn => {
        btn.addEventListener("click", (e) => {
          const index = e.target.dataset.index;
          carrito.splice(index, 1);
          localStorage.setItem("carrito", JSON.stringify(carrito));
          renderCart();
        });
      });
  
      document.querySelectorAll("input[type='number']").forEach(input => {
        input.addEventListener("input", (e) => {
          const index = e.target.dataset.index;
          const nuevaCantidad = parseInt(e.target.value);
          if (!isNaN(nuevaCantidad) && nuevaCantidad > 0) {
            carrito[index].cantidad = nuevaCantidad;
            localStorage.setItem("carrito", JSON.stringify(carrito));
            renderCart();
          }
        });
      });
    }
  
    renderCart();
    // Mostrar terminación de tarjeta
  async function cargarInfoTarjeta() {
  const email = localStorage.getItem("usuarioEmail");
  const btnTarjeta = document.getElementById("btnTarjeta"); // debe tener ese ID

  if (!email || !btnTarjeta) return;

  try {
    const res = await fetch("http://localhost:3000/api/usuarios");
    const usuarios = await res.json();
    const usuario = usuarios.find(u => u.email === email);

    if (usuario && usuario.numero_tarjeta) {
      const terminacion = usuario.numero_tarjeta.slice(-4);
      document.getElementById("tarjetaResumen").textContent = `Pagar con tarjeta terminación ${terminacion}`;

      // CAMBIA EL BOTÓN A "Eliminar tarjeta"
      btnTarjeta.textContent = "Eliminar tarjeta";
    btnTarjeta.classList.remove("btn-primary");
    btnTarjeta.classList.add("btn-danger");

    // Elimina comportamiento de modal
    btnTarjeta.removeAttribute("data-bs-toggle");
    btnTarjeta.removeAttribute("data-bs-target");


      btnTarjeta.onclick = async () => {
  if (confirm("¿Estás seguro de eliminar tu tarjeta?")) {
    try {
      const res = await fetch("http://localhost:3000/api/usuarios/eliminar-tarjeta", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email })
      });

      const data = await res.json();

      if (res.ok) {
        alert("Tarjeta eliminada correctamente.");
        document.getElementById("tarjetaResumen").textContent = "No hay tarjeta registrada";

        // Restaurar botón a "Agregar tarjeta"
        btnTarjeta.textContent = "Agregar tarjeta";
        btnTarjeta.classList.remove("btn-danger");
        btnTarjeta.classList.add("btn-primary");
        btnTarjeta.setAttribute("data-bs-toggle", "modal");
        btnTarjeta.setAttribute("data-bs-target", "#tarjetaModal");
      } else {
        alert(data.error || "Error al eliminar tarjeta");
      }
    } catch (err) {
      alert("Error al conectar con el servidor.");
      console.error(err);
    }
  }
};


    } else {
      btnTarjeta.textContent = "Agregar tarjeta";
      btnTarjeta.classList.remove("btn-danger");
      btnTarjeta.classList.add("btn-primary");

      // Restaurar modal
      btnTarjeta.setAttribute("data-bs-toggle", "modal");
      btnTarjeta.setAttribute("data-bs-target", "#tarjetaModal");

    }
  } catch (error) {
    console.error("Error al obtener tarjeta:", error);
  }
}



cargarInfoTarjeta(); // Llama a la función después de renderizar

  
    document.getElementById("vaciarCarrito").addEventListener("click", () => {
      localStorage.removeItem("carrito");
      renderCart();
    });
  });
  </script>
  <script src="scripts.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administrador - Crear Platillo</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="style2.css" />

  <style>
    body {
      font-family: 'Rubik', sans-serif;
      background-color: #f4f4f4;
    }

    .navbar {
      background-color: #0a3d62;
    }

    .navbar-brand {
      font-family: 'Rubik Mono One', sans-serif;
    }

    .banner {
      background-color: #0a3d62;
      color: #a3d5f7;
      text-align: center;
      padding: 2rem 1rem;
      font-family: 'Rubik Mono One', sans-serif;
      font-size: 2rem;
      letter-spacing: 1px;
    }

    .form-control,
    .form-select {
      font-family: 'Rubik', sans-serif;
    }

    .form-container {
      max-width: 600px;
      margin: 0 auto;
      background-color: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    #mensajeAdmin {
      font-weight: bold;
    }
    .bi {
      font-size:larger;
      color: #0a3d62;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="R.png" alt="Logo" style="height: 60px; margin-right: 10px;" />
      </a>
      <i class="bi bi-shield-lock"></i>
      <span class="text-white ms-auto me-3">Modo administrador</span>
    </div>
  </nav>

  <!-- Espaciador por navbar fija -->
  <div style="padding-top: 80px;"></div>

  <!-- Banner -->
  <div class="banner">CREAR NUEVO PLATILLO</div>

  <!-- Formulario -->
  <div class="form-container mt-4">
    <form id="crearPlatilloForm">
      <div class="mb-3">
        <input type="text" class="form-control" id="nombre" placeholder="Nombre del platillo" required />
      </div>
      <div class="mb-3">
        <textarea class="form-control" id="descripcion" rows="3" placeholder="Descripción del platillo" required></textarea>
      </div>
      <div class="mb-3">
        <input type="text" class="form-control" id="precio" placeholder="Precio (opcional)" />
      </div>
      <div class="mb-3">
        <select class="form-select" id="restaurante" required>
          <option value="">Selecciona restaurante</option>
          <option value="el-feo">El Feo</option>
          <option value="limon-y-chia">Limón y Chía</option>
          <option value="la-taqueria">La Taquería</option>
          <option value="el-terrible-Juan">El Terrible Juan</option>
          <option value="güich">Güich</option>
        </select>
      </div>
      <button type="submit" class="btn btn-success w-100">Guardar platillo</button>
    </form>
    <div id="mensajeAdmin" class="mt-3 text-center"></div>
  </div>

  <!-- Script -->
  <script src="scripts.js"></script>

</body>
</html>

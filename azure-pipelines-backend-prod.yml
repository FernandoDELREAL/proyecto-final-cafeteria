trigger:
- main

pool:
  name: cafeteria-pool

variables:
  dockerHubServiceConnection: 'sc-dockerhub-cafeteria-v2'
  azureServiceConnection: 'sc-azure-cafeteria-v2'
  dockerHubRepo: 'fernandodelreal14/cafeteria-backend'
  appName: 'cafeteria-backend-prod'
  dockerTag: '$(Build.BuildId)'

steps:

- checkout: self
  clean: true
  displayName: "Checkout del código"

- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: "Instalar Node.js"

- script: npm install
  workingDirectory: 'cafeteria-iteso-backend'
  displayName: "Instalar dependencias"

- script: npm test
  workingDirectory: 'cafeteria-iteso-backend'
  displayName: "Ejecutar pruebas"

- task: Docker@2
  displayName: "Login Docker Hub"
  inputs:
    command: login
    containerRegistry: $(dockerHubServiceConnection)

- task: Docker@2
  displayName: "Build backend PROD"
  inputs:
    command: build
    repository: $(dockerHubRepo)
    tags: |
      latest
      prod
      $(dockerTag)
    Dockerfile: 'cafeteria-iteso-backend/Dockerfile'
    buildContext: 'cafeteria-iteso-backend'

- task: Docker@2
  displayName: "Push backend PROD"
  inputs:
    command: push
    repository: $(dockerHubRepo)
    tags: |
      latest
      prod
      $(dockerTag)

- task: AzureWebAppContainer@1
  displayName: "Deploy backend PROD"
  inputs:
    azureSubscription: $(azureServiceConnection)
    appName: $(appName)
    imageName: "$(dockerHubRepo):latest"
